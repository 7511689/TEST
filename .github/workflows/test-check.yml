name: Chart Test Run

on:
  workflow_dispatch:

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Create Fixed Script and Run
        run: |
          cat << 'EOF' > test_chart.py
          import requests
          from bs4 import BeautifulSoup
          import json
          import re

          def debug_raw_string_data(url):
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              }
              try:
                  res = requests.get(url, headers=headers, timeout=30)
                  soup = BeautifulSoup(res.text, 'html.parser')
                  script_tags = soup.find_all('script')
                  
                  chart_data = None
                  for script in script_tags:
                      if script.string and "pageProps" in script.string:
                          match = re.search(r'\{.*\}', script.string)
                          if match:
                              try:
                                  raw_json = json.loads(match.group(0))
                                  chart_data = raw_json.get('props', {}).get('pageProps', {}).get('data', {}).get('chart', [])
                                  if chart_data:
                                      break
                              except:
                                  continue

                  if not chart_data:
                      match = re.search(r'"chart"\s*:\s*(\[.*?\])', res.text, re.DOTALL)
                      if match:
                          try:
                              chart_data = json.loads(match.group(1))
                          except:
                              pass

                  print("\n================ [ 가이섬 실제 원본 문자열 추출 ] ================", flush=True)
                  if chart_data and len(chart_data) > 0:
                      # 상위 3개의 아이템이 어떤 문자열로 구성되어 있는지 있는 그대로 출력
                      for i in range(min(3, len(chart_data))):
                          print(f"📋 [{i+1}번 데이터]: {chart_data[i]}", flush=True)
                  else:
                      print("❌ 데이터를 가져오지 못했습니다.", flush=True)
                  print("==================================================================\n", flush=True)

              except Exception as e:
                  print(f"🚨 에러 발생: {e}", flush=True)

          target_url = "https://가이섬.com/chart/genie/realtime/20260517/22"
          debug_raw_string_data(target_url)
          EOF
          
          python test_chart.py
        env:
          PYTHONUNBUFFERED: "1"

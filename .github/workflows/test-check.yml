name: Chart Test Run

on:
  workflow_dispatch:

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Create Fixed Script and Run
        run: |
          cat << 'EOF' > test_chart.py
          import json
          import datetime
          import requests
          import time
          from playwright.sync_api import sync_playwright

          def get_rank_full_search(page, url, song_title="Love wins all"):
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  
                  for page_num in range(1, 4):
                      print(f" 현재 {page_num}페이지 검색 중...", flush=True)
                      page.wait_for_selector('tr', timeout=10000)
                      rows = page.query_selector_all('tr')
                      
                      for row in rows:
                          inner_text = row.inner_text()
                          if song_title in inner_text:
                              parts = [p.strip() for p in inner_text.split('\n') if p.strip()]
                              rank = "".join(filter(str.isdigit, parts[0])) if parts else "OUT"
                              
                              inner_html = row.inner_html()
                              diff = "-"
                              if '↑' in inner_html or 'up' in inner_html.lower() or 'ico_up' in inner_html or 'txt_up' in inner_html:
                                  val = "".join(filter(str.isdigit, parts[1])) if len(parts) > 1 else ""
                                  diff = f"▲{val}" if val else "▲"
                              elif '↓' in inner_html or 'down' in inner_html.lower() or 'ico_down' in inner_html or 'txt_down' in inner_html:
                                  val = "".join(filter(str.isdigit, parts[1])) if len(parts) > 1 else ""
                                  diff = f"▼{val}" if val else "▼"
                              elif 'NEW' in inner_html.upper() or 'ico_new' in inner_html:
                                  diff = "NEW"
                              
                              print(f"🎯 곡 발견! {rank}위 ({diff})", flush=True)
                              return rank, diff
                      
                      next_page_num = page_num + 1
                      next_btn = page.query_selector(f'center a:has-text("{next_page_num}")')
                      
                      if next_btn:
                          # 클릭 전 현재 1등 곡 텍스트를 기억
                          first_row = page.query_selector('tr')
                          old_text = first_row.inner_text() if first_row else ""
                          
                          print(f"👉 {next_page_num}페이지 버튼 클릭", flush=True)
                          next_btn.click()
                          
                          # [핵심 수집 보완] 첫 번째 행의 텍스트가 다음 페이지 데이터로 바뀔 때까지 대기
                          try:
                              page.wait_for_function(
                                  f"() => document.querySelector('tr') && document.querySelector('tr').innerText !== `{old_text}`",
                                  timeout=5000
                              )
                              time.sleep(1) # 최종 렌더링 안정을 위한 최소 대기
                          except:
                              print(f"⚠️ {next_page_num}페이지 데이터 전환 대기 초과", flush=True)
                      else:
                          print(f"❌ {next_page_num}페이지 버튼을 찾지 못함", flush=True)
                          break
                  return "OUT", "-"
              except Exception as e:
                  print(f"🚨 에러 발생: {e}", flush=True)
                  return "OUT", "-"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print("=== 지니 실시간 테스트 ===", flush=True)
              genie_r, genie_d = get_rank_full_search(page, "https://가이섬.com/chart/genie/realtime")
              browser.close()
          EOF
          
          python test_chart.py
        env:
          PYTHONUNBUFFERED: "1"

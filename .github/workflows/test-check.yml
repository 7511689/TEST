name: Chart Test Run

on:
  workflow_dispatch:

jobs:
  test_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Create Fixed Script and Run
        run: |
          cat << 'EOF' > test_chart.py
          import time
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print("🔍 가이섬 지니 페이지 접속 중...", flush=True)
              page.goto("https://가이섬.com/chart/genie/realtime", wait_until="domcontentloaded", timeout=60000)
              page.wait_for_selector('tr', timeout=10000)
              
              print("\n================ [ 가이섬 하단 번호판 HTML 소스 ] ================", flush=True)
              # 하단 center 태그 내부의 전체 소스코드를 가져와 출력합니다.
              center_element = page.query_selector('center')
              if center_element:
                  print(center_element.inner_html(), flush=True)
              else:
                  # center 태그가 없을 경우 body 전체에서 찾기 위해 전체 출력
                  print("⚠️ center 태그를 찾지 못해 전체 body 소스를 일부 출력합니다.", flush=True)
                  print(page.content()[-2000:], flush=True) # 하단부 위주로 출력
              print("==================================================================\n", flush=True)
              
              browser.close()
          EOF
          
          python test_chart.py
        env:
          PYTHONUNBUFFERED: "1"

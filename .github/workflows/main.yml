name: Hourly Chart Update
on:
  schedule:
    # 매시 55분에 미리 실행을 시작하여 정시 정체를 피합니다.
    - cron: '30 * * * *' 
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium
      - name: Run collector
        run: python chart.py
      - name: Commit and Push
        run: |
          git config --global user.name "ChartBot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Update Chart Data" || exit 0
          git push
